name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 01:00 UTC = 10:00 KST
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse audit (representative pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        # performance/seo are "error" assertions (fail the check); accessibility/
        # best-practices stay "warn" (see lighthouserc.json). No `|| true` — a
        # threshold miss now fails this workflow, not just the deploy pipeline.
        # Pinned + lockfile (.github/lhci). `npx --yes` re-resolved every transitive
        # dep on each run; 2026-11-21 robots-parser 3.1.1 was 4 minutes old and
        # 404'd on the npm CDN, failing every open PR at once.
        run: |
          npm ci --prefix .github/lhci --no-audit --no-fund
          .github/lhci/node_modules/.bin/lhci autorun

      - name: CrUX (Chrome UX Report) — real-user field data
        # Skips gracefully if CRUX_API_KEY secret is not configured.
        run: node scripts/crux-report.mjs
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}

      - name: Summary
        if: always()
        run: echo "Lighthouse run complete. Report links are in the 'Run Lighthouse CI' step log (temporary-public-storage)." >> "$GITHUB_STEP_SUMMARY"
