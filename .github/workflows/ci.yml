name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run

      - name: Validate i18n keys
        run: npm run validate:i18n

      - name: Build
        run: npm run build

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    # 80분은 아래 CLOUDFLARE_CHECK_TIMEOUT(3600s = 60분)보다 커야 한다. 20분이던 동안
    # 이 잡은 Cloudflare 배포가 19분을 넘기는 순간 **반드시** cancelled 였고, 대기
    # 스크립트는 자기 예산을 한 번도 쓸 수 없었다(2026-08-09 ff9ee57: 배포는 성공했는데
    # 게이트만 잘림). 나머지 5개 repo 는 이미 80분인데 game 만 롤아웃에서 빠져 있었다.
    timeout-minutes: 80
    needs: validate
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Produces dist/sitemap-index.xml + dist/sitemap-*.xml so IndexNow URL
        # collection can read them from disk instead of HTTP-fetching the live
        # site from CI (Cloudflare 403s that self-fetch — see gotcha #10).
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Search submission must follow the deployment for this exact commit,
        # not a blind delay that may still leave the previous build live.
        run: python scripts/wait-cloudflare-check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_TIMEOUT: "3600"

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
