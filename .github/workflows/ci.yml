name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run

      - name: Validate i18n keys
        run: npm run validate:i18n

      - name: Build
        run: npm run build

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    needs: validate
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Produces dist/sitemap-index.xml + dist/sitemap-*.xml so IndexNow URL
        # collection can read them from disk instead of HTTP-fetching the live
        # site from CI (Cloudflare 403s that self-fetch — see gotcha #10).
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Search submission must follow the deployment for this exact commit,
        # not a blind delay that may still leave the previous build live.
        run: python scripts/wait-cloudflare-check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_TIMEOUT: "3600"

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
