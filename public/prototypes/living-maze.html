<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>살아 있는 미로</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101e20;color:#edf1dc;font:16px system-ui}main{max-width:960px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font:600 clamp(26px,5vw,46px) Georgia,serif;margin:14px 0}p{line-height:1.6}.eyebrow{color:#a5c1a0;letter-spacing:.18em;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,1fr);gap:24px;align-items:start}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px;background:#0a1518;border:1px solid #49605a;border-radius:16px;box-shadow:0 22px 50px #0005}.tile{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(16px,4vw,27px);border-radius:5px;background:#293c3b}.wall{background:linear-gradient(135deg,#4f6454,#233935);box-shadow:inset 0 4px #72846a55,inset -3px -5px #0003}.gate{background:#695b42;color:#ffdb8f;border:1px solid #cfab65}.opened{outline:1px dashed #a2c291;outline-offset:-4px}.player{background:#bde4c4;color:#183c36;box-shadow:0 0 24px #bce4bf55}.exit{color:#f3da94}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.stats span{background:#243a38;padding:8px 12px;border-radius:6px}.panel{padding:20px;border:1px solid #4c6358;border-radius:16px;background:#192c2c}.panel h2{font-size:18px;margin:0 0 12px}.message{min-height:84px;color:#d9deb9}button,select{font:inherit;min-height:46px;border:1px solid #7d9480;border-radius:8px;padding:10px 12px;background:#243e39;color:#eef2d8;cursor:pointer}button:hover{background:#355548}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #f1cf8a;outline-offset:3px}.actions{display:grid;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin:20px 0}.secondary{display:flex;gap:10px;flex-wrap:wrap}.legend,.note{font-size:13px;color:#a9bcb0}.result{color:#f8d68e;font-size:22px;min-height:28px}select{max-width:110px}@media(max-width:640px){main{padding:16px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:16px}.board{max-width:420px;width:100%;margin:auto}.message{min-height:0}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><div><span class="eyebrow">OIYO · 010</span><h1 id="title"></h1></div><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><p id="intro"></p><div class="stats" id="stats"></div><div class="layout"><section><div id="board" class="board" role="group"></div><p id="legend" class="legend"></p><div class="pad"><span></span><button data-action="up" aria-label="↑">↑</button><span></span><button data-action="left" aria-label="←">←</button><button data-action="down" aria-label="↓">↓</button><button data-action="right" aria-label="→">→</button></div></section><section class="panel"><h2 id="heading"></h2><p id="message" class="message" role="status"></p><div id="result" class="result" role="status"></div><div class="actions"><button data-action="observe" id="observe"></button><button data-action="offer" id="offer"></button><button data-action="wait" id="wait"></button><button data-action="call" id="call"></button></div><p id="hint"></p><div class="secondary"><button id="restart"></button><button id="next"></button></div></section></div><p id="note" class="note"></p></main>
<script type="module">
import {createLivingMaze,advanceLivingMaze,mazeTile,nearbyGate} from './living-maze-engine.js';
const C={
ko:['살아 있는 미로','길을 찾지 말고, 길을 설득하세요. 닫힌 벽 옆에서 관찰한 뒤 원하는 것을 건네고 ✧ 출구로 향하세요.','빛','긴장','행동','벽의 속삭임','관찰하기','빛 2 건네기','조용히 기다리기','크게 부르기','같은 미로 재시작','다른 성향','● 나 · ◇ 살아 있는 벽 · ✧ 출구','내부 규칙 시제품 · 6개 성향 배치. 3D 탐험·벽의 장기 기억은 미구현.','아직 들리는 속삭임이 없습니다. 벽 옆으로 다가가세요.','이 벽은 빛을 원합니다. 빛 2를 건네세요.','이 벽은 고요를 원합니다. 두 번 연속 기다리세요.','벽이 길을 열었습니다.','벽에 막혔습니다. 다른 길이나 제안을 찾아보세요.','가까이에 닫힌 살아 있는 벽이 없습니다.','빛이 부족합니다. 관찰하고 다른 통로를 찾아보세요.','벽이 빛을 거부했습니다. 긴장이 높아집니다.','소음에 벽들이 닫히고 긴장이 3 올라갔습니다.','숨을 고릅니다. 긴장이 줄어듭니다.','미로를 빠져나왔습니다','미로가 마음을 닫았습니다','밤이 깊어졌습니다','관찰은 무료입니다. 소음은 긴장 +3, 긴장 6 또는 40행동이면 탐험이 끝납니다.','한 걸음 옮겼습니다.','벽','길'],
en:['The Living Maze','Persuade the path. Observe beside a closed wall, offer what it wants, and reach ✧.','Light','Tension','Actions','The wall whispers','Observe','Offer 2 light','Wait quietly','Call loudly','Restart maze','New temperament','● You · ◇ Living wall · ✧ Exit','Internal rules prototype · 6 layouts. 3D exploration and lasting wall memory are not implemented.','No whisper yet. Approach a living wall.','This wall wants light. Offer 2 light.','This wall wants silence. Wait twice in a row.','The wall opened a path.','Blocked. Look for another path or an offering.','No closed living wall nearby.','Not enough light. Observe and seek another route.','The wall rejected the light. Tension rises.','Noise closed walls and raised tension by 3.','A quiet breath. Tension falls.','You escaped','The maze shut you out','Night has fallen','Observation is free. Noise adds 3 tension. At 6 tension or 40 actions, the expedition ends.','You moved one step.','Wall','Path'],
ja:['生きている迷路','道を説得しよう。閉じた壁の隣で観察し、望むものを渡して✧へ。','光','緊張','行動','壁のささやき','観察する','光を2渡す','静かに待つ','大声を出す','やり直す','別の性格','● 自分 · ◇ 生きた壁 · ✧ 出口','内部ルール試作・6配置。3D探索と壁の長期記憶は未実装。','壁の隣へ近づいてください。','光を望んでいます。光を2渡しましょう。','静寂を望んでいます。2回続けて待ちましょう。','壁が道を開きました。','通れません。別の道や提案を探しましょう。','近くに閉じた生きた壁はありません。','光が足りません。観察して別の道を探しましょう。','光を拒みました。緊張が上がります。','音で壁が閉じ、緊張が3上昇しました。','静かな呼吸。緊張が下がります。','脱出しました','迷路が心を閉ざしました','夜が更けました','観察は無料。大声で緊張+3。緊張6または40行動で探索終了。','一歩進みました。','壁','道'],
zh:['活着的迷宫','说服道路。在关闭的墙边观察，给予它想要的东西，前往✧。','光','紧张','行动','墙的低语','观察','给予2点光','安静等待','大声呼喊','重新开始','另一种性格','● 你 · ◇ 活墙 · ✧ 出口','内部规则原型，共6种布局。尚未实现3D探索与墙的长期记忆。','尚无低语。请靠近活墙。','这面墙想要光。给予2点光。','这面墙想要安静。连续等待两次。','墙打开了道路。','道路受阻。寻找其他路径或提议。','附近没有关闭的活墙。','光不足。观察并寻找其他路径。','墙拒绝了光，紧张上升。','噪声关闭了墙，紧张增加3。','安静呼吸，紧张下降。','成功逃离','迷宫关闭了心门','夜已深','观察免费。呼喊使紧张+3，紧张达到6或行动达到40时结束。','前进了一步。','墙','路'],
fr:['Le labyrinthe vivant','Convainquez le chemin. Observez près d’un mur fermé, offrez ce qu’il désire et rejoignez ✧.','Lumière','Tension','Actions','Le mur murmure','Observer','Offrir 2 lumières','Attendre en silence','Appeler fort','Recommencer','Autre caractère','● Vous · ◇ Mur vivant · ✧ Sortie','Prototype interne, 6 plans. Exploration 3D et mémoire durable restent à réaliser.','Approchez-vous d’un mur vivant.','Ce mur veut de la lumière. Offrez-en 2.','Ce mur veut du calme. Attendez deux fois de suite.','Le mur a ouvert un passage.','Passage bloqué. Cherchez une autre voie ou une offrande.','Aucun mur vivant fermé à proximité.','Lumière insuffisante. Observez et cherchez une autre voie.','Le mur refuse la lumière. La tension monte.','Le bruit ferme les murs et ajoute 3 de tension.','Une respiration calme. La tension baisse.','Vous êtes sorti','Le labyrinthe vous rejette','La nuit est tombée','Observer est gratuit. Le bruit ajoute 3 de tension. Fin à 6 de tension ou 40 actions.','Vous avancez d’un pas.','Mur','Chemin'],
es:['El laberinto vivo','Convence al camino. Observa junto a un muro cerrado, ofrece lo que desea y llega a ✧.','Luz','Tensión','Acciones','El muro susurra','Observar','Ofrecer 2 de luz','Esperar en silencio','Gritar','Reiniciar','Otro carácter','● Tú · ◇ Muro vivo · ✧ Salida','Prototipo interno, 6 mapas. Faltan exploración 3D y memoria duradera de los muros.','Acércate a un muro vivo.','Este muro quiere luz. Ofrece 2.','Este muro quiere silencio. Espera dos veces seguidas.','El muro abrió un camino.','Paso bloqueado. Busca otra ruta o una oferta.','No hay un muro vivo cerrado cerca.','Falta luz. Observa y busca otra ruta.','El muro rechazó la luz. Sube la tensión.','El ruido cerró muros y aumentó la tensión en 3.','Respira en silencio. Baja la tensión.','Has escapado','El laberinto te rechazó','Ha caído la noche','Observar es gratis. Gritar suma 3 de tensión. Termina con 6 de tensión o 40 acciones.','Avanzaste un paso.','Muro','Camino']};
let state=createLivingMaze(),lang='ko';const $=id=>document.getElementById(id);
function render(){const t=C[lang];document.documentElement.lang=lang;document.title=t[0];Object.entries({title:0,intro:1,heading:5,observe:6,offer:7,wait:8,call:9,restart:10,next:11,legend:12,note:13,hint:27}).forEach(([id,i])=>$(id).textContent=t[i]);$('stats').replaceChildren();[`${t[2]} ${state.light}`,`${t[3]} ${state.stress}/6`,`${t[4]} ${state.turns}/40`].forEach(v=>{const e=document.createElement('span');e.textContent=v;$('stats').append(e);});const gi=nearbyGate(state),g=state.gates[gi];const messages={start:14,moved:28,blocked:18,alone:19,empty:20,refused:21,noise:22,waiting:23,opened:17,observed:g?.need==='light'?15:16};$('message').textContent=t[messages[state.event]];$('result').textContent=state.phase==='exploring'?'':t[{escaped:24,overwhelmed:25,expired:26}[state.phase]];$('board').setAttribute('aria-label',t[0]);$('board').replaceChildren();for(let y=0;y<7;y++)for(let x=0;x<7;x++){const e=document.createElement('div'),tile=mazeTile(state,x,y),gate=state.gates.find(g=>g.x===x&&g.y===y),player=state.player.x===x&&state.player.y===y;e.className=`tile ${tile}${gate?.open?' opened':''}${player?' player':''}`;e.textContent=player?'●':tile==='exit'?'✧':tile==='gate'?(gate.known?(gate.need==='light'?'☀':'☾'):'◇'):'';e.setAttribute('role','img');e.setAttribute('aria-label',`${x},${y}: ${player?t[12].split(' · ')[0]:tile==='wall'?t[29]:tile==='gate'?gate.known?t[gate.need==='light'?15:16]:t[5]:tile==='exit'?t[12].split(' · ')[2]:t[30]}`);$('board').append(e);}document.querySelectorAll('[data-action]').forEach(b=>b.disabled=state.phase!=='exploring');$('offer').disabled=state.phase!=='exploring'||gi<0||state.light<2;}
const act=a=>{state=advanceLivingMaze(state,a);render();};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('restart').onclick=()=>{state=createLivingMaze(state.seed);render();};$('next').onclick=()=>{state=createLivingMaze(state.seed+1);render();};$('lang').onchange=e=>{lang=e.target.value;render();};window.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('button,select,input,textarea'))return;const a={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(a){e.preventDefault();act(a);}});render();
</script></body></html>
