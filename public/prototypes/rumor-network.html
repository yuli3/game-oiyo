<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>소문 네트워크</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeadd;color:#233d35;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(28px,5vw,48px);margin:12px 0}p{line-height:1.65}.eyebrow{font-size:12px;letter-spacing:.16em;color:#697563}button,select{font:inherit;min-height:46px;border:1px solid #7c8d77;border-radius:10px;padding:10px 14px;background:#faf8ef;color:inherit;cursor:pointer}button:hover:not(:disabled){background:#dce6cb}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #b65e36;outline-offset:3px}.panel{background:#faf8ef;border:1px solid #c4c8b7;border-radius:18px;padding:20px;margin:16px 0}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.message{font-size:clamp(18px,3vw,25px);font-weight:650;min-height:80px}.badge{display:inline-block;background:#e2e9d7;padding:4px 10px;border-radius:20px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{text-align:left}.actions small{display:block;line-height:1.5;margin-top:5px}.original{border-left:4px solid #b38a47;padding-left:14px}svg{display:block;width:100%;height:auto}svg text{font:600 14px system-ui;fill:#243c34}.stats{display:flex;gap:12px;flex-wrap:wrap}.changed{color:#a6442c}.repair{display:flex;gap:8px;flex-wrap:wrap}.status{padding:14px;border-radius:10px;background:#e5ecd9;font-weight:650}ol{padding-left:24px}li{padding:8px 0;font-size:14px;border-bottom:1px solid #ddd}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}#retry{background:#284c3e;color:white}@media(max-width:700px){main{padding:16px}.columns{grid-template-columns:1fr;gap:0}.panel{padding:16px;margin:10px 0}header{align-items:start}h1{font-size:29px}.actions{grid-template-columns:1fr 1fr}select{max-width:95px}.message{min-height:0}}
.game-cover{display:block;width:100%;height:clamp(100px,18vw,190px);object-fit:cover;border-radius:14px;margin:12px 0 18px}@media(max-width:600px){.game-cover{height:110px}}
</style></head><body><main><header><div><span class="eyebrow">OIYO · SIGNAL LAB</span><h1 id="title"></h1></div><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><img class="game-cover" src="./rumor-network-cover.webp" alt="" width="1200" height="675" decoding="async"><p id="intro"></p><div class="stats"><span id="budget" class="badge"></span><span id="route" class="badge"></span></div><div class="columns"><section class="panel"><svg id="map" viewBox="0 0 440 300" role="img"></svg><div id="status" class="status" role="status"></div></section><section class="panel"><div class="original"><small id="original-label"></small><p id="original" class="message"></p></div><small id="current-label"></small><p id="current" class="message"></p><div id="repair" class="repair"></div></section></div><h2 id="choose"></h2><div id="actions" class="actions"></div><footer><span id="score"></span><button id="retry"></button></footer><details open><summary id="rules-label"></summary><ol id="rules"></ol></details><details><summary id="history-label"></summary><ol id="history"></ol></details><p id="note"></p></main><script type="module" src="./rumor-network-ui.js"></script></body></html>
