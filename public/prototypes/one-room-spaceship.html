<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>한 칸짜리 우주선</title><style>
*{box-sizing:border-box}body{margin:0;background:#101915;color:#edf1da;font:16px system-ui}main{max-width:940px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(26px,5vw,46px);margin:8px 0}small{color:#bac8a4;letter-spacing:.12em}.window{height:180px;border:10px solid #3d493a;border-radius:80px 80px 18px 18px;background:radial-gradient(ellipse at 75% 130%,#8fa577 0 27%,#23352e 28%,#101d24 46%,#080e16 70%);position:relative;margin:24px 0;overflow:hidden}.window{background-image:url(./one-room-spaceship-home.webp);background-size:cover;background-position:center 46%}.window:before{display:none;content:'✦       ·                 ✧           ·';position:absolute;inset:22px;color:#e4d6a1;word-spacing:40px}.window p{position:absolute;bottom:6px;left:20px;font:14px monospace}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel{background:#202e25;border:1px solid #56654b;padding:18px;border-radius:12px}.panel strong{display:block;font-size:30px;margin:14px 0}meter{width:100%;height:18px;accent-color:#b8d17c}button{font:inherit;border:1px solid #819067;border-radius:9px;background:#2a3d2c;color:#f0f2df;padding:14px;cursor:pointer}button:focus-visible{outline:3px solid #f3ca74;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#c7d78e;color:#172419;border-color:#e8f1c4}.actions{margin:18px 0}.status{border:1px solid #819067;border-radius:9px;padding:14px 18px;background:#202a21;line-height:1.7}footer{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}#launch{background:#d0c181;color:#18231a;font-weight:700}p{line-height:1.7}.muted{color:#b5c2ac}.danger{color:#ffb694}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px}.panel{padding:12px}.window{height:145px}header{display:block}}

details{margin-top:24px;padding:18px;border:1px solid #56654b;border-radius:12px}summary{cursor:pointer;min-height:44px;display:list-item;padding:10px 0}summary:focus-visible,select:focus-visible{outline:3px solid #f3ca74;outline-offset:3px}.panel{min-width:0;overflow-wrap:anywhere}.panel strong{font-size:clamp(20px,4vw,30px)}.grid button{min-width:0;overflow-wrap:anywhere}select{max-width:100%;font:inherit;padding:10px;background:#26372d;color:#edf1da;border:1px solid #819067;border-radius:8px}label{display:inline-block;margin:6px}button{min-height:44px}.settings{display:flex;flex-wrap:wrap;gap:12px}.grid[hidden],[hidden]{display:none!important}@media(max-width:620px){main[data-flight=true] .window,main[data-flight=true] .settings,main[data-flight=true] .introduction,main[data-flight=true] .instructions,main[data-flight=true] header small,main[data-flight=true] header h1,main[data-flight=true] #best{display:none}main[data-flight=true] header>div:last-child{display:flex;justify-content:space-between;align-items:center}main[data-flight=true] .panel strong{margin:6px 0}main[data-flight=true] h2{font-size:18px;margin:12px 0 6px}main[data-flight=true] .actions{margin:8px 0}main[data-flight=true] #crew{font-size:13px}main[data-flight=true] footer{position:sticky;bottom:0;background:#101915;padding:10px 0;margin-top:8px}main[data-flight=true] footer button{padding:10px}} </style></head><body><main>
<header><div><small>OIYO · FLIGHT 06</small><h1 data-copy="title">한 칸짜리 우주선</h1></div><div><b id="clock"></b><p id="distance"></p><p id="best" class="muted"></p></div></header>
<div class="settings"><label>🌐 <select id="locale" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="fr">Français</option><option value="es">Español</option></select></label><label><span data-copy="mode"></span> <select id="mode"><option value="computer" data-copy="solo"></option><option value="human" data-copy="duo"></option></select></label><label id="view-setting" hidden><span data-copy="view"></span> <select id="view-mode"><option value="shared" data-copy="shared"></option><option value="split" data-copy="split"></option></select></label></div>
<div class="window" aria-hidden="true"><p>HOME · 09</p></div>
<div id="role-switch" hidden><button id="captain-view" data-copy="captain"></button> <button id="crew-view" data-copy="crew"></button></div>
<div class="grid"><section class="panel"><span data-copy="oxygen"></span><strong id="oxygen"></strong><meter id="oxygen-meter" min="0" max="100"></meter></section><section class="panel"><span data-copy="heat"></span><strong id="heat"></strong><meter id="heat-meter" min="0" max="100"></meter></section><section class="panel"><span data-copy="power"></span><strong id="power"></strong><meter id="power-meter" min="0" max="100"></meter></section><section class="panel"><span data-copy="thrust"></span><strong id="thrust"></strong></section></div>
<p class="introduction" data-copy="intro"></p><p data-copy="controls" class="muted instructions"></p>
<div id="captain-controls"><h2 data-copy="captain"></h2><div class="grid actions"><button data-system="oxygen"></button><button data-system="cooling"></button><button data-system="power"></button><button data-system="thrust"></button></div></div>
<div id="crew-controls" hidden><h2 data-copy="crew"></h2><div class="grid actions"><button data-crew="oxygen"></button><button data-crew="cooling"></button><button data-crew="power"></button><button data-crew="thrust"></button></div></div>
<div class="status" id="status" role="status"></div><p id="crew" class="muted"></p><p id="weather" class="danger" role="status"></p>
<footer><button id="launch" data-copy="launch"></button><button id="pause" disabled></button><button id="reset" data-copy="reset"></button><button id="sound" data-copy="sound" aria-pressed="false"></button></footer><p id="sound-feedback" role="status"></p><details><summary data-copy="guide"></summary><h3 data-copy="guideStart"></h3><p data-copy="guideStartBody"></p><h3 data-copy="guideIncident"></h3><p data-copy="guideIncidentBody"></p><h3 data-copy="guideCoop"></h3><p data-copy="guideCoopBody"></p></details><p data-copy="help" class="muted"></p>
</main><script type="module" src="./one-room-spaceship-ui.js"></script></body></html>
