*{box-sizing:border-box}body{margin:0;background:#e6eeea;color:#183c42;font:16px system-ui}::selection{background:#b8d5c5}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font:600 clamp(26px,4vw,42px) Georgia,serif;margin:6px 0}button,select,summary{font:inherit;min-height:44px}button,select{border:1px solid #7b9994;background:#f6f7ec;color:inherit;border-radius:8px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#c9dfd1}:focus-visible{outline:3px solid #ac692d;outline-offset:3px}select{max-width:108px}.cover{display:block;width:100%;height:130px;object-fit:cover;border-radius:14px;margin:14px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;padding:12px 0;border-bottom:1px solid #b0c5bf}.stats b{font-weight:600}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start}.sea{background:#c5dfda;border-radius:16px;margin:16px 0;overflow:hidden}canvas{display:block;width:100%;height:330px}canvas[hidden]{display:none}.forecast{font-size:19px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slot{height:59px;font-size:13px;position:relative}.slot.danger{background:#bad9df;border-style:dashed}.slot[aria-pressed=true]{outline:3px solid #ad712f;outline-offset:1px}.slot.braced{box-shadow:inset 0 0 0 3px #d7b26a}.slot strong{display:block}.panel{padding:16px 0}.panel h2{font-size:21px;margin:6px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.primary{background:#214f53;color:#fff8e7;width:100%;margin:10px 0}.status{min-height:26px;font-weight:600}.secondary{display:flex;gap:8px;flex-wrap:wrap}details{margin-top:18px;border-top:1px solid #b0c5bf;padding-top:8px}summary{cursor:pointer;display:flex;align-items:center}details p{line-height:1.75;max-width:70ch}.record{font-size:13px;line-height:1.6}.fallback{font-size:13px}#sound[aria-press import {readCampaign,saveCampaign} from './prototype-campaign.js';
const C={ko:['고래 위의 도시','항해','행동','피로','균형','주민','집','정원','빈 자리','고정하기','고래 달래기','실행 취소','파도 맞이하기','다시 항해','다음 항해','소리','항해 안내','집을 선택한 뒤 빈 칸을 누르면 옮깁니다. 파란 점선 칸은 다음 파도에 잠깁니다.','12번의 파도를 넘어 주민 12명을 지키세요. 매 턴 행동은 2번입니다. 고정은 이번 파도의 피해 1을 막고, 달래기는 피로를 12 줄입니다. 중앙 가로줄은 잠수에 안전하지만 세 번째 항해에서는 중앙 한 칸만 안전합니다. 정원이 살아 있으면 매 턴 피로가 2 줄어듭니다. 건물 상태가 0이 되거나 피로가 100이 되면 위험합니다.','호흡','왼쪽 기울기','잠수','오른쪽 기울기','다음 파도','항해를 마쳤습니다','마을을 지키지 못했습니다','행동을 고르고 다음 파도를 맞이하세요.','최고 점수','임무 완료','기록을 저장하지 못했습니다. 이 화면에서는 계속 플레이할 수 있습니다.','3D를 사용할 수 없어 아래 지도로 플레이합니다.','3D 장면과 같은 칸 배치를 아래 지도에서 조작할 수 있습니다. 공개 리더보드는 없습니다.','상태','고정됨','점수'],en:['City on a Whale','Voyage','Actions','Fatigue','Balance','Residents','Home','Garden','Empty','Brace','Soothe whale','Undo','Meet the wave','Restart voyage','Next voyage','Sound','Voyage guide','Select a building, then an empty tile to move it. Blue dashed tiles flood next.','Keep all 12 residents through 12 waves. You have 2 actions per turn. Bracing blocks one wave; soothing removes 12 fatigue. The middle row is safe during dives, but only the center is safe on voyage 3. A living garden removes 2 fatigue each turn. Buildings fail at 0 health; the whale fails at 100 fatigue.','Breath','Roll left','Dive','Roll right','Next wave','You reached the harbor','The village was lost','Choose your actions, then meet the wave.','Best score','Voyages complete','Saving failed. You can keep playing on this screen.','3D is unavailable. Use the map below.','The map controls the same tiles as the 3D scene. There is no public leaderboard.','Health','Braced','Score'],ja:['クジラの上の街','航海','行動','疲労','均衡','住民','家','庭','空き','固定','なだめる','取り消す','波を迎える','再出航','次の航海','音','航海案内','建物を選んで空きマスを押すと移動。青い点線のマスは次の波で浸水します。','12回の波を越え住民12人を守ろう。毎ターン2行動。固定は1回の波を防ぎ、なだめると疲労が12減る。潜水では中央の横列が安全だが、第3航海では中央1マスのみ安全。庭が生きていれば毎ターン疲労−2。建物の状態0や疲労100に注意。','呼吸','左へ傾く','潜水','右へ傾く','次の波','港に着きました','街を守れませんでした','行動を選んで次の波を迎えよう。','最高得点','航海完了','保存できません。引き続き遊べます。','3Dを利用できません。下の地図で遊べます。','地図と3Dのマスは同じ配置です。公開ランキングはありません。','状態','固定済み','得点'],zh:['鲸背之城','航程','行动','疲劳','平衡','居民','房屋','花园','空位','固定','安抚鲸鱼','撤销','迎接海浪','重新出航','下一航程','声音','航海指南','先选建筑，再点空格移动。蓝色虚线格将在下次海浪中进水。','撑过12次海浪并保护12名居民。每回合2次行动。固定可挡一次海浪，安抚减少12疲劳。潜水时中间横排安全，第3航程只有中心格安全。花园存活时每回合疲劳−2。建筑状态0或疲劳100会导致危险。','呼吸','向左倾斜','潜水','向右倾斜','下次海浪','抵达港口','未能保护村庄','选择行动，然后迎接海浪。','最高分','已完成航程','保存失败，可继续游戏。','无法使用3D，请使用下方地图。','地图与3D场景的格子一致。没有公开排行榜。','状态','已固定','分数'],fr:['La ville sur la baleine','Voyage','Actions','Fatigue','Équilibre','Habitants','Maison','Jardin','Libre','Amarrer','Apaiser','Annuler','Affronter la vague','Repartir','Voyage suivant','Son','Guide','Sélectionnez un bâtiment puis une case libre. Les cases bleues en pointillés seront inondées.','Protégez 12 habitants pendant 12 vagues, avec 2 actions par tour. Amarrer protège une vague; apaiser retire 12 de fatigue. La rangée centrale résiste aux plongées, sauf au voyage 3 où seul le centre est sûr. Un jardin vivant retire 2 de fatigue par tour. Danger à 0 de santé ou 100 de fatigue.','Respiration','Roulis gauche','Plongée','Roulis droit','Prochaine vague','Vous avez atteint le port','Le village est perdu','Choisissez vos actions avant la vague.','Meilleur score','Voyages terminés','Échec de sauvegarde. Vous pouvez continuer à jouer.','3D indisponible. Utilisez la carte.','La carte commande les mêmes cases que la scène 3D. Aucun classement public.','Santé','Amarré','Score'],es:['La ciudad sobre la ballena','Viaje','Acciones','Fatiga','Equilibrio','Habitantes','Casa','Jardín','Libre','Asegurar','Calmar','Deshacer','Recibir la ola','Reiniciar viaje','Siguiente viaje','Sonido','Guía','Selecciona un edificio y luego una casilla libre. Las casillas azules discontinuas se inundarán.','Protege a 12 habitantes durante 12 olas. Tienes 2 acciones por turno. Asegurar protege una ola y calmar reduce 12 de fatiga. La fila central resiste las inmersiones, salvo en el viaje 3: solo el centro es seguro. Un jardín vivo reduce 2 de fatiga por turno. Peligro con salud 0 o fatiga 100.','Respiración','Inclinar izquierda','Inmersión','Inclinar derecha','Próxima ola','Llegaste al puerto','La aldea se perdió','Elige tus acciones antes de la ola.','Mejor puntuación','Viajes completos','No se pudo guardar. Puedes seguir jugando.','3D no disponible. Usa el mapa.','El mapa controla las mismas casillas que la escena 3D. No hay clasificación pública.','Salud','Asegurado','Puntos']};
let state=createWhaleCity(),selected=0,lang='ko',history=[],scene=null,sound=false,audio=null,saved=false,saveFailed=false;const $=id=>document.getElementById(id);let storage;try{storage=localStorage;}catch{}
function tone(){if(!sound)return;try{audio??=new AudioContext();void audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=state.phase==='arrived'?660:220;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.start();o.stop(audio.currentTime+.17);}catch{}}
const floodLabel={ko:'다음 파도에 침수',en:'Floods on the next wave',ja:'次の波で浸水',zh:'下次海浪会淹没',fr:'Inondée à la prochaine vague',es:'Se inunda en la próxima ola'};
function render(){const focusedSlot=document.activeElement?.dataset?.slot;const t=C[lang];document.documentElement.lang=lang;document.title=t[0];Object.entries({title:0,brace:9,soothe:10,undo:11,advance:12,restart:13,next:14,sound:15,'help-title':16,hint:17,rules:18,fallback:30,note:31}).forEach(([id,i])=>$(id).textContent=t[i]);$('stats').replaceChildren();[`${t[1]} ${state.mission+1} · ${state.turn}/12`,`${t[2]} ${state.actions}`,`${t[3]} ${state.fatigue}/100`,`${t[4]} ${whaleTilt(state)}`,`${t[5]} ${whalePeople(state)}/12`].forEach(v=>{const e=document.createElement('b');e.textContent=v;$('stats').append(e);});$('forecast').textContent=state.phase==='sailing'?`${t[23]}: ${t[{breath:19,left:20,dive:21,right:22}[seaForecast(state)]]}`:'';const wet=floodedSlots(state);$('grid').setAttribute('aria-label',t[0]);$('grid').replaceChildren();for(let slot=0;slot<9;slot++){const b=state.buildings.find(b=>b.slot===slot&&b.health>0),e=document.createElement('button');e.className=`slot ${wet.includes(slot)?'danger':''} ${b?.braced?'braced':''}`;e.dataset.slot=slot;e.dataset.building=b?.id??'';e.setAttribute('aria-pressed',String(b?.id===selected));e.disabled=state.phase!=='sailing';const title=document.createElement('strong');title.textContent=b?`${t[b.id===3?7:6]} ${b.id===3?'':b.id+1}`:t[8];const sub=document.createElement('span');sub.textContent=b?`${t[32]} ${b.health}/3${b.braced?' · '+t[33]:''}`:`${Math.floor(slot/3)+1},${slot%3+1}`;e.append(title,sub);e.setAttribute('aria-label',`${title.textContent}, ${sub.textContent}${wet.includes(slot)?', '+floodLabel[lang]:''}`);e.onclick=()=>{if(b){selected=b.id;render();}else act(s=>moveWhaleBuilding(s,selected,slot));};$('grid').append(e);}const b=state.buildings.find(b=>b.id===selected);$('selection').textContent=`${t[b.id===3?7:6]} ${b.id===3?'':b.id+1} · ${t[32]} ${b.health}/3`;$('brace').disabled=state.phase!=='sailing'||!state.actions||b.health===0||b.braced;$('soothe').disabled=state.phase!=='sailing'||!state.actions||state.fatigue===0;$('undo').disabled=state.phase!=='sailing'||history.length===0;$('advance').disabled=state.phase!=='sailing';$('status').textContent=t[state.phase==='arrived'?24:state.phase==='lost'?25:26]+(state.phase==='arrived'?` · ${t[34]} ${whaleScore(state)}`:'');if(state.phase==='arrived'&&!saved){saved=true;saveFailed=!saveCampaign(storage,'whale-city',state.mission,whaleScore(state));}const scores=readCampaign(storage,'whale-city');$('record').textContent=`${t[28]} ${Object.keys(scores).length}/3 · ${t[27]} ${scores[state.mission]??'—'}${saveFailed?' · '+t[29]:''}`;scene?.update(state,selected);if(focusedSlot!==undefined){const target=$('grid').querySelector(`[data-slot='${focusedSlot}']`);if(target&&!target.disabled)target.focus({preventScroll:true});}}
function act(fn){const n=fn(state);if(n!==state){history.push(state);state=n;tone();}render();}$('brace').onclick=()=>act(s=>braceWhaleBuilding(s,selected));$('soothe').onclick=()=>act(sootheWhale);$('undo').onclick=()=>{if(history.length){state=history.pop();render();}};$('advance').onclick=()=>{state=advanceWhale(state);history=[];tone();render();};function restart(m){state=createWhaleCity(m);selected=0;history=[];saved=false;saveFailed=false;render();}$('restart').onclick=()=>restart(state.mission);$('next').onclick=()=>restart(state.mission+1);$('lang').onchange=e=>{lang=e.target.value;render();};$('sound').onclick=()=>{sound=!sound;$('sound').setAttribute('aria-pressed',String(sound));tone();};render();
try{if(new URLSearchParams(location.search).get('view')==='2d')throw Error('2d requested');const {mountWhaleScene}=await import('./whale-city-scene.js');scene=mountWhaleScene($('scene'));render();}catch{$('scene').hidden=true;$('fallback').hidden=false;}
window.addEventListener('pagehide',e=>{if(!e.persisted){scene?.dispose();void audio?.close();}});
</script></body></html>
