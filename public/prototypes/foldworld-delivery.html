<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>폴드월드 택배</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8d6;color:#283d3a;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(24px,5vw,40px)}p{line-height:1.7}button,select{font:inherit;min-height:46px;padding:10px 14px;border:1px solid #81977e;border-radius:10px;background:#fffdf3;color:inherit;cursor:pointer}button:disabled{opacity:.45}:focus-visible{outline:3px solid #c07538;outline-offset:3px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#b6bc9d;padding:12px;border-radius:16px;margin:20px 0}.board div{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(20px,4vw,36px);border:1px solid #b4b695;border-radius:4px;background:#faf5dc}.board div:nth-child(6n+3){border-right:4px dashed #c07538}.board[data-folded=true]{box-shadow:inset -180px 0 100px #94ab8544}.board .wall{background:#56645a}.board .pair{outline:3px solid #c07538;outline-offset:-4px}.controls{display:flex;gap:10px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;margin:20px auto;width:174px}.status{background:#fffaf0;border-left:4px solid #b57b45;padding:14px}select{max-width:100px}@media(max-width:480px){main{padding:16px}.board{gap:3px;padding:8px}}.game-cover{display:block;width:100%;height:clamp(100px,18vw,190px);object-fit:cover;border-radius:14px;margin:12px 0 18px}@media(max-width:600px){.game-cover{height:110px}}
.board div{position:relative}.truck-sprite{width:95%;height:95%;object-fit:contain}.cargo-badge{position:absolute;left:3px;top:1px;color:#644008;font-size:18px;background:#fff7cf;border-radius:3px;line-height:1;padding:2px}
</style><main><header><h1 id="title"></h1><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><img class="game-cover" src="./foldworld-delivery-cover.webp" alt="" width="1200" height="675" decoding="async"><p id="help"></p><div id="board" class="board" role="img"></div><p id="status" class="status" role="status"></p><div class="controls"><button id="fold"></button><button id="cross"></button><button id="reset"></button><button id="next"></button></div><div class="pad"><span></span><button data-action="up" aria-label="↑">↑</button><span></span><button data-action="left" aria-label="←">←</button><button data-action="down" aria-label="↓">↓</button><button data-action="right" aria-label="→">→</button></div><p id="note"></p></main><script type="module">
import {createFoldworld,advanceFoldworld,foldWall} from './foldworld-delivery-engine.js';
const copy={ko:['폴드월드 택배','◆ 화물을 싣고 ▣ 목적지로 배달하세요. 접으면 좌우 대칭 칸이 맞닿습니다. 주황 테두리는 건너갈 칸입니다. 어두운 칸은 통과할 수 없습니다.','접기 / 펼치기','겹친 칸으로 이동','다시 시작','다음 배달','배달 완료','접기','이동','내부 규칙 시제품 · 방향키로 이동. 화물 파손·중력·3D 접기 연출은 아직 구현하지 않았습니다.'],en:['Foldworld Delivery','Collect ◆ and deliver to ▣. Folding connects mirrored tiles. Orange marks the crossing destination. Dark tiles block travel.','Fold / unfold','Cross layers','Restart','Next delivery','Delivered','Folds','Moves','Internal rules prototype · arrow keys move. Cargo damage, gravity and 3D folding are not implemented yet.'],ja:['フォールドワールド便','◆を回収して▣へ。折ると左右対称のマスが接続します。橙色が移動先、暗いマスは壁です。','折る / 開く','重なりを渡る','やり直す','次の配達','配達完了','折り回数','移動','内部ルール試作・矢印で移動。破損・重力・3D折り演出は未実装。'],zh:['折叠世界快递','取得◆并送到▣。折叠后可前往左右对称格。橙色框是目的格，深色格不能通过。','折叠 / 展开','跨越纸层','重来','下一单','送达','折叠','移动','内部规则原型，方向键移动。尚未实现货损、重力和3D折叠。'],fr:['Livraison pliée','Récupérez ◆ puis livrez à ▣. Plier relie les cases symétriques. Orange : destination du passage. Cases sombres : murs.','Plier / déplier','Changer de couche','Recommencer','Livraison suivante','Livré','Plis','Pas','Prototype interne, flèches pour bouger. Dégâts, gravité et pliage 3D restent à réaliser.'],es:['Reparto plegado','Recoge ◆ y entrega en ▣. Plegar conecta casillas simétricas. Naranja: destino del cruce. Las oscuras bloquean el paso.','Plegar / abrir','Cruzar capas','Reiniciar','Siguiente entrega','Entregado','Pliegues','Pasos','Prototipo interno; flechas para moverte. Faltan daños, gravedad y plegado 3D.']};let lang='ko',state=createFoldworld();const $=id=>document.getElementById(id);
function render(){const t=copy[lang];document.documentElement.lang=lang;document.title=t[0];['title','help','fold','cross','reset','next'].forEach((id,i)=>$(id).textContent=t[i]);$('note').textContent=t[9];$('status').textContent=`${state.phase==='delivered'?t[6]+' · ':''}${t[7]} ${state.folds} · ${t[8]} ${state.moves}`;$('board').dataset.folded=state.folded;$('board').setAttribute('aria-label',t[0]);$('board').replaceChildren();for(let y=0;y<4;y++)for(let x=0;x<6;x++){const cell=document.createElement('div');if(foldWall({x,y}))cell.classList.add('wall');if(state.folded&&x===5-state.player.x&&y===state.player.y)cell.classList.add('pair');cell.textContent=x===state.player.x&&y===state.player.y?(state.carrying?'🚚':'●'):x===state.target.x&&y===state.target.y?'▣':!state.carrying&&x===state.parcel.x&&y===state.parcel.y?'◆':'';if(x===state.player.x&&y===state.player.y){const fallback=cell.textContent;const sprite=document.createElement('img');sprite.className='truck-sprite';sprite.src='./foldworld-truck.webp';sprite.alt='';sprite.onerror=()=>{cell.textContent=fallback;};cell.replaceChildren(sprite);if(state.carrying){const badge=document.createElement('span');badge.className='cargo-badge';badge.textContent='◆';cell.append(badge);}}$('board').append(cell);}document.querySelectorAll('[data-action],#fold').forEach(b=>b.disabled=state.phase!=='playing');$('cross').disabled=state.phase!=='playing'||!state.folded||foldWall({x:5-state.player.x,y:state.player.y});}
const act=a=>{state=advanceFoldworld(state,a);render();};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('fold').onclick=()=>act('fold');$('cross').onclick=()=>act('cross');$('reset').onclick=()=>{state=createFoldworld(state.level);render();};$('next').onclick=()=>{state=createFoldworld(state.level+1);render();};$('lang').onchange=e=>{lang=e.target.value;render();};window.addEventListener('keydown',e=>{if(e.repeat||e.target.closest('button,select,input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;const a={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(a){e.preventDefault();act(a);}});render();
</script></html>
