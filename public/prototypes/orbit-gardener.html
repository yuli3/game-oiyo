<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>궤도 정원사</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1825;color:#e9ede1;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font:500 clamp(28px,5vw,44px) Georgia,serif;margin:10px 0}p{line-height:1.6}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}canvas{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#22322f,#121e2e 55%,#0f1825 72%)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.stats span,.planet{border:1px solid #526262;background:#1a2933;border-radius:10px;padding:10px 12px}.planet{margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.planet p{font-size:13px;margin:7px 0;color:#c0ccba}progress{width:100%;height:8px;accent-color:#b6ce88}button,select{font:inherit;min-height:44px;padding:9px 12px;border:1px solid #92a18b;border-radius:8px;background:#263c3c;color:#edf0df;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#3d5550}:focus-visible{outline:3px solid #f4d291;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:52px;color:#e4c88e}.note{color:#aebbb4;font-size:13px}select{max-width:108px}@media(max-width:640px){main{padding:16px}.layout{grid-template-columns:1fr;gap:8px}canvas{max-width:280px;margin:auto}.planet{padding:8px 10px;margin-bottom:6px}.planet p{margin:3px 0}.intro{font-size:14px}.stats{margin:10px 0}}
.game-cover{display:block;width:100%;height:clamp(100px,18vw,190px);object-fit:cover;border-radius:14px;margin:12px 0 18px}@media(max-width:600px){.game-cover{height:110px}}
</style></head><body><main><header><h1 id="title"></h1><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><img class="game-cover" src="./orbit-gardener-cover.webp" alt="" width="1200" height="675" decoding="async"><p id="intro" class="intro"></p><div id="stats" class="stats"></div><div class="layout"><section><canvas id="space" width="480" height="480" role="img"></canvas><p id="clearance" class="note"></p></section><section><div id="planets"></div><div class="controls"><button id="launch"></button><button id="pause"></button><button id="step"></button></div><p id="status" class="status" role="status"></p><div class="controls"><button id="restart"></button><button id="next"></button></div></section></div><p id="note" class="note"></p></main><script type="module">
import {createOrbitGarden,plantOrbit,launchOrbit,stepOrbit,orbitClearance,orbitRadius,planetPosition,planetSize} from './orbit-gardener-engine.js';
const C={ko:['궤도 정원사','세 행성에 꽃을 심고 생태를 지키세요. 꽃이 2개 미만이면 생명력이 줄어듭니다. 꽃 하나마다 궤도가 6 좁아지고 행성이 커집니다. 배치를 마친 뒤 관측을 시작하세요.','씨앗','날짜','행성','꽃','생명력','궤도 반지름','심기','가지치기','관측 시작','일시정지','계속 관측','하루 진행','같은 임무 재시작','다음 임무','배치를 조절하세요.','관측 중입니다.','관측을 멈췄습니다.','생태와 궤도가 안정되었습니다.','행성이 충돌했습니다. 배치를 다시 조절하세요.','생태가 시들었습니다. 모든 행성에 꽃이 필요합니다.','최소 궤도 간격','간격이 겹칩니다. 충돌 위험이 있습니다.','내부 규칙 시제품 · 실제 천체 물리가 아닌 결정론적 장난감 모형. 3D 행성 탐험·성장 연출은 미구현.','세 행성의 궤도와 현재 위치'],en:['Orbit Gardener','Plant flowers on three planets. Fewer than 2 flowers drains health. Each flower shrinks the orbital radius by 6 and enlarges the planet. Arrange your garden, then observe.','Seeds','Day','Planet','Flowers','Health','Orbit radius','Plant','Prune','Start observing','Pause','Resume','Advance a day','Restart mission','Next mission','Arrange your garden.','Observing.','Observation paused.','Your ecosystem and orbits are stable.','Planets collided. Revise your planting.','An ecosystem withered. Every planet needs flowers.','Minimum orbital clearance','Orbits overlap. A collision is possible.','Internal rules prototype · deterministic toy physics, not astronomy. 3D exploration and growth animations remain unimplemented.','Three planetary orbits and current positions'],ja:['軌道の庭師','3つの惑星に花を植えましょう。花が2つ未満だと生命力が減ります。花1つで軌道半径が6縮み、惑星が大きくなります。配置後に観測開始。','種','日','惑星','花','生命力','軌道半径','植える','剪定','観測開始','一時停止','観測再開','1日進む','やり直す','次の任務','花を配置してください。','観測中です。','観測停止中。','生態と軌道が安定しました。','惑星が衝突しました。配置を変えましょう。','生態が枯れました。すべての惑星に花が必要です。','最小軌道間隔','軌道が重なり衝突の恐れがあります。','内部ルール試作。実際の天体物理ではありません。3D探索・成長演出は未実装。','3つの惑星の軌道と現在位置'],zh:['轨道园丁','在三颗行星上种花。少于2朵花会损失生命力。每朵花使轨道半径缩小6并增大行星。布置后开始观测。','种子','天','行星','花','生命力','轨道半径','种植','修剪','开始观测','暂停','继续','前进一天','重试任务','下一任务','请布置花园。','正在观测。','观测已暂停。','生态与轨道稳定了。','行星相撞，请重新布置。','生态枯萎了，每颗行星都需要花。','最小轨道间距','轨道重叠，存在碰撞风险。','内部规则原型，采用简化模型而非真实天体物理。尚未实现3D探索和生长动画。','三颗行星的轨道和当前位置'],fr:['Jardinier orbital','Plantez sur trois planètes. Moins de 2 fleurs fait baisser la santé. Chaque fleur réduit le rayon orbital de 6 et agrandit la planète. Placez, puis observez.','Graines','Jour','Planète','Fleurs','Santé','Rayon orbital','Planter','Tailler','Observer','Pause','Reprendre','Avancer un jour','Recommencer','Mission suivante','Composez votre jardin.','Observation en cours.','Observation en pause.','Écosystème et orbites stabilisés.','Collision. Revoyez vos plantations.','Un écosystème a dépéri. Chaque planète a besoin de fleurs.','Écart orbital minimal','Les orbites se chevauchent : risque de collision.','Prototype interne, physique simplifiée. Exploration 3D et animations de croissance restent à réaliser.','Orbites et positions de trois planètes'],es:['Jardinero orbital','Planta flores en tres planetas. Menos de 2 flores reduce la salud. Cada flor reduce el radio orbital en 6 y agranda el planeta. Organiza y observa.','Semillas','Día','Planeta','Flores','Salud','Radio orbital','Plantar','Podar','Observar','Pausa','Continuar','Avanzar un día','Reiniciar','Siguiente misión','Organiza tu jardín.','Observando.','Observación en pausa.','Ecosistema y órbitas estables.','Los planetas chocaron. Cambia las plantas.','Un ecosistema se marchitó. Todos necesitan flores.','Separación orbital mínima','Las órbitas se solapan. Hay riesgo de colisión.','Prototipo interno con física simplificada. Faltan exploración 3D y animaciones de crecimiento.','Órbitas y posiciones de tres planetas']};
let state=createOrbitGarden(),lang='ko',timer=null;const $=id=>document.getElementById(id),colors=['#91c7a0','#e7b879','#9caddf'];
const planetImages=['green','sand','blue'].map(color=>{const img=new Image();img.onload=()=>draw();img.src=`./orbit-planet-${color}.webp`;return img;});
function stop(){if(timer!==null){clearInterval(timer);timer=null;}}
function tick(){state=stepOrbit(state);if(state.phase!=='running')stop();render();}
function play(){if(timer===null&&state.phase==='running')timer=setInterval(tick,160);render();}
function draw(){const c=$('space'),ctx=c.getContext('2d');if(!ctx)return;ctx.clearRect(0,0,480,480);ctx.save();ctx.translate(240,240);for(let i=0;i<48;i++){ctx.fillStyle='#dae0c755';ctx.fillRect(Math.sin(i*91)*220,Math.cos(i*43)*220,1.5,1.5);}const glow=ctx.createRadialGradient(0,0,4,0,0,45);glow.addColorStop(0,'#fff0b8');glow.addColorStop(.35,'#e7bc6faa');glow.addColorStop(1,'#e7bc6f00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,45,0,Math.PI*2);ctx.fill();state.planets.forEach((p,i)=>{const r=orbitRadius(p),pos=planetPosition(p),size=planetSize(p);ctx.strokeStyle=colors[i]+'66';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();const g=ctx.createRadialGradient(pos.x-size*.3,pos.y-size*.3,1,pos.x,pos.y,size);g.addColorStop(0,colors[i]);g.addColorStop(1,'#243c46');ctx.fillStyle=g;ctx.beginPath();ctx.arc(pos.x,pos.y,size,0,Math.PI*2);ctx.fill();const sprite=planetImages[i];if(sprite.complete&&sprite.naturalWidth>0){ctx.save();ctx.beginPath();ctx.arc(pos.x,pos.y,size,0,Math.PI*2);ctx.clip();ctx.drawImage(sprite,pos.x-size*1.04,pos.y-size*1.04,size*2.08,size*2.08);ctx.restore();}for(let f=0;f<p.flowers;f++){const a=f*Math.PI*2/p.flowers;ctx.fillStyle='#f5e4a1';ctx.beginPath();ctx.arc(pos.x+Math.cos(a)*size*.72,pos.y+Math.sin(a)*size*.72,2,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#ffffff';ctx.font='14px system-ui';ctx.fillText(String(i+1),pos.x+size+5,pos.y+5);});ctx.restore();}
function render(){const t=C[lang];document.documentElement.lang=lang;document.title=t[0];Object.entries({title:0,intro:1,launch:10,step:13,restart:14,next:15,note:24}).forEach(([id,i])=>$(id).textContent=t[i]);$('pause').textContent=t[timer===null?12:11];$('space').setAttribute('aria-label',t[25]);$('stats').replaceChildren();[`${t[2]} ${state.seeds}`,`${t[3]} ${state.day}/${state.target}`].forEach(v=>{const e=document.createElement('span');e.textContent=v;$('stats').append(e);});const clearance=Math.round(orbitClearance(state));$('clearance').textContent=`${t[22]} ${clearance} · ${clearance<=0?t[23]:''}`;$('planets').replaceChildren();state.planets.forEach((p,i)=>{const card=document.createElement('div');card.className='planet';const row=document.createElement('div');row.className='row';const name=document.createElement('strong');name.textContent=`${t[4]} ${i+1}`;name.style.color=colors[i];const portrait=document.createElement('img');portrait.src=planetImages[i].src;portrait.alt='';portrait.width=32;portrait.height=32;portrait.onerror=()=>portrait.hidden=true;row.append(portrait,name);for(const [delta,key] of [[1,8],[-1,9]]){const b=document.createElement('button');b.textContent=t[key];b.dataset.planet=i;b.dataset.delta=delta;b.setAttribute('aria-label',`${t[4]} ${i+1} ${t[key]}`);b.disabled=state.phase!=='planning'||(delta===1?(state.seeds<1||p.flowers>=8):p.flowers===0);b.onclick=()=>{state=plantOrbit(state,i,delta);render();};row.append(b);}const info=document.createElement('p');info.textContent=`${t[5]} ${p.flowers} · ${t[6]} ${p.health}/100 · ${t[7]} ${orbitRadius(p)}`;const progress=document.createElement('progress');progress.max=100;progress.value=p.health;progress.setAttribute('aria-label',`${t[4]} ${i+1} ${t[6]}`);card.append(row,info,progress);$('planets').append(card);});$('status').textContent=t[state.phase==='planning'?16:state.phase==='running'?(timer===null?18:17):{balanced:19,collision:20,withered:21}[state.phase]];$('launch').disabled=state.phase!=='planning';$('pause').disabled=state.phase!=='running';$('step').disabled=state.phase!=='running'||timer!==null;draw();}
$('launch').onclick=()=>{state=launchOrbit(state);play();};$('pause').onclick=()=>{if(timer!==null){stop();render();}else play();};$('step').onclick=tick;$('restart').onclick=()=>{stop();state=createOrbitGarden(state.mission);render();};$('next').onclick=()=>{stop();state=createOrbitGarden(state.mission+1);render();};$('lang').onchange=e=>{lang=e.target.value;render();};document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();render();}});window.addEventListener('pagehide',stop);render();
</script></body></html>
