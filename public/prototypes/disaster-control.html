<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>미니어처 재난 관제실</title><style>
*{box-sizing:border-box}body{margin:0;background:#142329;color:#edf0dd;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:clamp(24px,4vw,38px);margin:8px 0}p{line-height:1.6}.cover{display:block;width:100%;height:150px;object-fit:cover;border-radius:14px;margin:16px 0}.stats,.controls{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:#263b3e;border-radius:7px;padding:8px 12px}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin:18px 0}.city{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.district{text-align:left;padding:12px;border:1px solid #667d72;border-radius:12px;background:#263a3a;color:inherit;min-width:0}.district[aria-pressed=true]{outline:3px solid #edd09b;outline-offset:2px}.district:disabled{opacity:.4}.district strong{display:block}.district small{display:block;line-height:1.8;font-size:12px}.district progress{width:100%;height:7px;accent-color:#aaca9a}.blocks{height:60px;display:flex;gap:5px;align-items:end;margin:12px 0;background:linear-gradient(transparent 80%,#7c978366 80%);position:relative}.blocks i{display:block;width:24%;height:70%;background:repeating-linear-gradient(0deg,#d7d9bf 0 8px,#71877a 8px 11px);box-shadow:5px -4px #859785;transform:skewY(-8deg)}.blocks i:nth-child(2){height:95%}.blocks i:nth-child(3){height:45%}.flooded .blocks{background:linear-gradient(transparent 50%,#75b5d988 50%)}.burning .blocks:after{content:'▲';position:absolute;right:8px;bottom:5px;color:#ffac68;font-size:30px;text-shadow:none}.blackout .blocks i{background:#485354}.panel{padding:18px;border-radius:14px;border:1px solid #546d68;background:#1d3035}.panel h2{font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select{font:inherit;min-height:44px;border:1px solid #889b89;border-radius:8px;background:#304846;color:#edf0dd;padding:10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #f5d79b;outline-offset:3px}.note{font-size:13px;color:#b4c2b8}.status{color:#f5d69e;min-height:30px}#advance{background:#b6c994;color:#192c27;width:100%;margin-top:14px}select{max-width:108px}@media(max-width:650px){main{padding:16px}.cover{height:110px}.layout{grid-template-columns:1fr;gap:14px}.city{gap:7px}.district{padding:8px}.blocks{height:42px}.panel{padding:14px}h1{font-size:24px}.intro{font-size:14px}}
#undo{margin-top:10px;width:100%}button:hover:enabled{background:#41635c}::selection{background:#547b66}.stats{font-variant-numeric:tabular-nums}.district small{word-break:keep-all}#record{min-height:20px}@media(max-width:650px){.blocks{height:27px;margin:6px 0}.district small{font-size:11px;line-height:1.5}.cover{height:78px}.layout{gap:8px}.panel h2{margin:0 0 8px}.panel p{margin:7px 0}.panel{padding:12px}.intro{margin:8px 0}.stats{font-size:13px}.stats span{padding:5px 8px}}
</style></head><body><main><header><h1 id="title"></h1><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><img class="cover" src="./disaster-control-cover.webp" alt="" width="1200" height="675"><p id="intro" class="intro"></p><div id="stats" class="stats"></div><p id="forecast"></p><div class="layout"><div id="city" class="city" role="group"></div><section class="panel"><h2 id="selection"></h2><p id="detail"></p><div class="actions"><button data-action="fire"></button><button data-action="drain"></button><button data-action="repair"></button><button data-action="evacuate"></button></div><button id="undo"></button><button id="advance"></button><p id="status" class="status" role="status"></p><p id="record" class="note"></p><div class="controls"><button id="restart"></button><button id="next"></button></div></section></div><p id="rules" class="note"></p><p id="note" class="note"></p></main><script type="module">
import {readCampaign,saveCampaign} from './prototype-campaign.js';
import {createDisaster,respond,advanceDisaster,canRespond,survivors,forecast} from './disaster-control-engine.js';
const C={ko:['미니어처 재난 관제실','두 구조대를 배치해 8턴을 버티세요. 주민 24명 중 20명 이상과 구역 6곳 중 4곳 이상을 지키면 성공입니다.','턴','남은 구조대','생존','대피 완료','구역','건물 상태','주민','화재','침수','전력','정상','정전','진화 −2','배수 −2','전력 복구','주민 대피','다음 턴','재시작','다른 상황','도시를 지켰습니다.','구조 목표를 달성하지 못했습니다.','구역을 선택하고 구조대를 보내세요.','다음 발생','화재 3은 인접 구역으로 번집니다. 침수 2 이상이면 정전됩니다. 턴당 피해: 화재×12 + 침수×9 + 정전4. 같은 구역에 두 번 출동할 수 있습니다.','내부 규칙 시제품 · 가상의 도시와 주민. 실제 재난 대응 지침이 아닙니다. 3D 관제·캠페인은 미구현.'],en:['Miniature Disaster Control','Deploy two crews for 8 turns. Keep at least 20 of 24 residents alive and 4 of 6 districts standing.','Turn','Crews left','Survivors','Evacuated','District','Integrity','Residents','Fire','Flood','Power','On','Outage','Extinguish −2','Drain −2','Restore power','Evacuate','Next turn','Restart','New scenario','You protected the city.','The rescue target was not met.','Select a district and dispatch a crew.','Next incident','Fire 3 spreads to neighbors. Flood 2+ cuts power. Damage each turn: fire×12 + flood×9 + outage4. Both crews may serve one district.','Internal rules prototype with fictional residents. Not real emergency guidance. 3D control and campaigns are not implemented.'],ja:['ミニチュア災害管制室','2隊を配置して8ターンを乗り切ろう。住民24人中20人以上、6地区中4地区以上を守れば成功。','ターン','残り隊','生存','避難済み','地区','建物状態','住民','火災','浸水','電力','正常','停電','消火 −2','排水 −2','電力復旧','住民避難','次のターン','やり直す','別の状況','街を守りました。','救助目標に届きませんでした。','地区を選んで隊を派遣してください。','次の発生','火災3は隣へ延焼。浸水2以上で停電。毎ターンの損害:火災×12+浸水×9+停電4。同じ地区に2回派遣できます。','架空の街の内部試作。実際の災害対応指針ではありません。3D管制・キャンペーンは未実装。'],zh:['微型灾难指挥室','部署两支救援队，坚持8回合。保住24名居民中的至少20名，以及6个街区中的至少4个。','回合','剩余队伍','生存','已撤离','街区','建筑状态','居民','火灾','洪水','电力','正常','停电','灭火 −2','排水 −2','恢复电力','撤离居民','下一回合','重来','另一情景','你保护了城市。','未达到救援目标。','选择街区并派遣队伍。','下次事件','火灾3会蔓延到相邻街区。洪水2以上导致停电。每回合损伤:火灾×12+洪水×9+停电4。可两次派往同一区。','虚构城市的内部规则原型，非现实救灾指南。尚未实现3D指挥和战役。'],fr:['Poste de secours miniature','Déployez deux équipes pendant 8 tours. Sauvez au moins 20 habitants sur 24 et préservez 4 quartiers sur 6.','Tour','Équipes','Survivants','Évacués','Quartier','État','Habitants','Feu','Crue','Courant','Actif','Panne','Éteindre −2','Drainer −2','Rétablir le courant','Évacuer','Tour suivant','Recommencer','Autre scénario','Vous avez protégé la ville.','Objectif de secours non atteint.','Sélectionnez un quartier et envoyez une équipe.','Prochain incident','Feu 3 se propage aux voisins. Crue 2+ coupe le courant. Dégâts par tour : feu×12 + crue×9 + panne4. Deux équipes peuvent servir le même quartier.','Prototype fictif, pas un guide de secours réel. Poste 3D et campagne restent à réaliser.'],es:['Control de desastres en miniatura','Despliega dos equipos durante 8 turnos. Conserva al menos 20 de 24 habitantes y 4 de 6 distritos.','Turno','Equipos','Supervivientes','Evacuados','Distrito','Estado','Habitantes','Fuego','Inundación','Electricidad','Activa','Apagón','Apagar −2','Drenar −2','Restaurar energía','Evacuar','Siguiente turno','Reiniciar','Otro escenario','Protegiste la ciudad.','No se alcanzó la meta de rescate.','Selecciona un distrito y envía un equipo.','Próximo incidente','Fuego 3 se propaga a vecinos. Inundación 2+ corta la luz. Daño por turno: fuego×12 + inundación×9 + apagón4. Ambos equipos pueden ir al mismo distrito.','Prototipo ficticio, no es una guía real de emergencias. Faltan control 3D y campaña.']};
const EX={ko:['출동 취소','임무 기록','최고 점수','완료','저장 실패: 이 화면에서는 계속 플레이할 수 있습니다.','점수','출동 완료'],en:['Undo dispatch','Mission record','Best score','Complete','Saving failed; you can keep playing.','Score','Crew dispatched'],ja:['派遣を取り消す','任務記録','最高得点','完了','保存失敗。引き続き遊べます。','得点','派遣完了'],zh:['撤销派遣','任务记录','最高分','完成','保存失败，可继续游戏。','分数','已派遣'],fr:['Annuler l’envoi','Bilan des missions','Meilleur score','Terminé','Échec de sauvegarde; vous pouvez jouer.','Score','Équipe envoyée'],es:['Deshacer envío','Registro de misiones','Mejor puntuación','Completado','No se pudo guardar; puedes seguir jugando.','Puntos','Equipo enviado']};
let history=[],saved=false,saveFailed=false,lastAction=null,storage;try{storage=localStorage;}catch{}
let state=createDisaster(),selected=0,lang='ko';const $=id=>document.getElementById(id);
function render(){const focusedDistrict=document.activeElement?.dataset?.district;const t=C[lang];document.documentElement.lang=lang;document.title=t[0];Object.entries({title:0,intro:1,advance:18,restart:19,next:20,rules:25,note:26}).forEach(([id,i])=>$(id).textContent=t[i]);$('stats').replaceChildren();[`${t[2]} ${state.turn}/8`,`${t[3]} ${state.crews}`,`${t[4]} ${survivors(state)}/24`,`${t[5]} ${state.saved}`].forEach(v=>{const e=document.createElement('span');e.textContent=v;$('stats').append(e);});const f=forecast(state);$('forecast').textContent=state.phase==='responding'?`${t[24]}: ${t[6]} ${f.index+1} · ${t[f.kind==='fire'?9:10]} +1`:'';$('city').setAttribute('aria-label',t[0]);$('city').replaceChildren();state.districts.forEach((d,i)=>{const b=document.createElement('button');b.className=`district ${d.fire?'burning':''} ${d.water?'flooded':''} ${d.power?'':'blackout'}`;b.dataset.district=i;b.setAttribute('aria-pressed',String(i===selected));b.disabled=state.phase!=='responding'||d.health===0;const title=document.createElement('strong');title.textContent=`${t[6]} ${i+1}`;const blocks=document.createElement('div');blocks.className='blocks';blocks.setAttribute('aria-hidden','true');for(let n=0;n<3;n++)blocks.append(document.createElement('i'));const bar=document.createElement('progress');bar.max=100;bar.value=d.health;bar.setAttribute('aria-label',t[7]);const info=document.createElement('small');info.textContent=`${t[7]} ${d.health}`;const residents=document.createElement('small');residents.textContent=`${t[8]} ${d.people}`;const risk=document.createElement('small');risk.textContent=`${t[9]} ${d.fire} / ${t[10]} ${d.water}`;b.append(title,blocks,bar,info,residents,risk);b.onclick=()=>{selected=i;render();};$('city').append(b);});const d=state.districts[selected];$('selection').textContent=`${t[6]} ${selected+1}`;$('detail').textContent=`${t[7]} ${d.health}/100 · ${t[8]} ${d.people} · ${t[11]} ${t[d.power?12:13]}`;document.querySelectorAll('[data-action]').forEach((b,i)=>{b.textContent=t[14+i];b.disabled=!canRespond(state,selected,b.dataset.action);});$('advance').disabled=state.phase!=='responding';const ex=EX[lang];const score=survivors(state)*20+state.districts.reduce((n,d)=>n+d.health,0);$('status').textContent=t[state.phase==='stabilized'?21:state.phase==='failed'?22:23]+(state.phase==='stabilized'?` · ${ex[5]} ${score}`:lastAction?` · ${ex[6]}: ${t[6]} ${lastAction.index+1}, ${t[14+['fire','drain','repair','evacuate'].indexOf(lastAction.action)]}`:'');$('undo').textContent=ex[0];$('undo').disabled=state.phase!=='responding'||history.length===0;if(state.phase==='stabilized'&&!saved){saved=true;saveFailed=!saveCampaign(storage,'disaster-control',state.seed,score);}const scores=readCampaign(storage,'disaster-control');$('record').textContent=`${ex[1]} ${Object.keys(scores).length}/3 · ${ex[2]} ${scores[state.seed]??'—'}${saveFailed?' · '+ex[4]:''}`;if(focusedDistrict!==undefined){const target=$('city').querySelector(`[data-district='${focusedDistrict}']`);if(target&&!target.disabled)target.focus({preventScroll:true});}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const next=respond(state,selected,b.dataset.action);if(next!==state){history.push({state,lastAction});state=next;lastAction={index:selected,action:b.dataset.action};}render();});$('undo').onclick=()=>{const prev=history.pop();if(prev){state=prev.state;lastAction=prev.lastAction;render();}};$('advance').onclick=()=>{state=advanceDisaster(state);history=[];lastAction=null;render();};$('restart').onclick=()=>{state=createDisaster(state.seed);selected=0;history=[];saved=false;saveFailed=false;lastAction=null;render();};$('next').onclick=()=>{state=createDisaster(state.seed+1);selected=0;history=[];saved=false;saveFailed=false;lastAction=null;render();};$('lang').onchange=e=>{lang=e.target.value;render();};render();
</script></body></html>
