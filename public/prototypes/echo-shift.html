<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>에코시프트</title><style>
*{box-sizing:border-box}body{margin:0;background:#060e19;color:#dbedf1;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(30px,5vw,52px);margin:10px 0}.tag{font:12px monospace;letter-spacing:.15em;color:#7bb9c4}p{line-height:1.6;color:#a6bdca}button,select{font:inherit;min-height:46px;padding:12px 16px;border:1px solid #345365;border-radius:10px;background:#142737;color:#d8eef1;cursor:pointer}:focus-visible{outline:3px solid #ffca6a;outline-offset:3px}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){background:#234556}select{max-width:110px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats>div{background:#102130;border:1px solid #243e50;border-radius:12px;padding:12px}.stats strong{display:block;font-size:25px}.stats small{color:#a6bdca}.stage{position:relative;height:390px;background:radial-gradient(ellipse at center,#153043,#040a12 75%);border:1px solid #345365;border-radius:20px;margin:16px 0;overflow:hidden}canvas{display:block;width:100%;height:100%}#fallback{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;max-width:520px;margin:auto;padding:10px;height:100%;align-content:center}#fallback span{display:grid;place-items:center;aspect-ratio:1;border-radius:2px;background:#0d1721;font-size:20px}#fallback[hidden],canvas[hidden]{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pulses{display:grid;gap:10px;align-content:center}button[data-action=loud]{border-color:#bc7651;color:#ffc89f}button[data-action=soft]{border-color:#4ab3bb;color:#93ecdf}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:240px;margin:auto}.pad button{min-width:52px;touch-action:manipulation}#status{background:#102333;border-left:3px solid #5fe6cc;padding:14px;color:#d7f8ed;min-height:52px}#echo{font:14px monospace;color:#f5cc89;line-height:1.5;min-height:44px}footer{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.help{font-size:14px}#audio-status{font-size:13px}.title-line{font-size:18px;margin:0 0 18px}@media(max-width:600px){main{padding:16px}.stage{height:300px}.stats>div{padding:9px}.stats strong{font-size:22px}.controls{gap:10px}.pulses button{font-size:14px;padding:10px}.pad{gap:5px}.pad button{padding:8px;min-width:42px}.intro{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.game-cover{display:block;width:100%;height:clamp(100px,18vw,190px);object-fit:cover;border-radius:14px;margin:12px 0 18px}@media(max-width:600px){.game-cover{height:110px}}
</style></head><body><main><header><div><span class="tag">OIYO · ECHO LAB</span><h1 id="title"></h1></div><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><img class="game-cover" src="./echo-shift-cover.webp" alt="" width="1200" height="675" decoding="async"><p id="hook" class="title-line"></p><p id="intro" class="intro"></p><div class="stats"><div><small id="turn-label"></small><strong id="turn"></strong></div><div><small id="alert-label"></small><strong id="alert"></strong></div><div><small id="relic-label"></small><strong id="relic"></strong></div></div><div class="stage" id="stage" tabindex="0"><canvas id="canvas"></canvas><div id="fallback" hidden></div></div><div id="status" role="status"></div><p id="echo" aria-live="polite"></p><div class="controls"><div class="pulses"><button data-action="soft" id="soft"></button><button data-action="loud" id="loud"></button><button data-action="wait" id="wait"></button></div><div class="pad"><span></span><button data-action="up">↑</button><span></span><button data-action="left">←</button><button data-action="down">↓</button><button data-action="right">→</button></div></div><footer><button id="reset"></button><button id="sound" aria-pressed="false"></button></footer><p id="audio-status" role="status"></p><p id="help" class="help"></p><p id="note" class="help"></p></main><script type="module" src="./echo-shift-client.js"></script></body></html>
